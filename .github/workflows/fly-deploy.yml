name: Fly Deploy

# Auto-deploy to Fly.io on every push to main.
# Requires a repo secret FLY_API_TOKEN (create with: fly tokens create deploy).
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual runs from the Actions tab

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group   # never run two deploys at once
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
