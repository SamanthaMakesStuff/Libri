<!DOCTYPE html>
<html lang="en" data-theme="sunset" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina · Your Reading Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --r-sm: calc(0.75rem - 4px);
      --r-md: calc(0.75rem - 2px);
      --r-lg: 0.75rem;
      --r-xl: calc(0.75rem + 4px);
      --pill: 9999px;
      --maxw: 1160px;
    }
    /* ---- light / dark bases (shared across themes) ---- */
    [data-mode="light"] {
      --bg: #FAF6EE; --bg2: #F3ECDD; --card: #FFFDF9;
      --text: #1e232e; --muted: #6b7280; --border: rgba(30,35,46,0.10);
      --shadow: 0 6px 22px rgba(40,30,10,0.08); --primary-contrast: #FFFFFF;
      --track: rgba(30,35,46,0.07);
    }
    [data-mode="dark"] {
      --bg: #0A0F1D; --bg2: #0d1424; --card: #111827;
      --text: #E7ECF3; --muted: #94a1b6; --border: rgba(255,255,255,0.10);
      --shadow: 0 8px 30px rgba(0,0,0,0.45); --primary-contrast: #0A0F1D;
      --track: rgba(255,255,255,0.08);
    }
    /* ---- theme palettes (primary + accent per theme/mode) ---- */
    [data-theme="sunset"][data-mode="light"] { --primary:#3B82F6; --accent:#F43F5E; }
    [data-theme="sunset"][data-mode="dark"]  { --primary:#60A5FA; --accent:#FB7185; }
    [data-theme="luxe"][data-mode="light"]    { --primary:#0F766E; --accent:#F59E0B; }
    [data-theme="luxe"][data-mode="dark"]     { --primary:#34D399; --accent:#FFD000; }
    [data-theme="cyber"][data-mode="light"]   { --primary:#0891B2; --accent:#FF477E; }
    [data-theme="cyber"][data-mode="dark"]    { --primary:#22D3EE; --accent:#FF477E; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(1100px 600px at 88% -8%, color-mix(in srgb, var(--primary) 12%, transparent), transparent 60%),
        radial-gradient(900px 520px at -6% 8%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 55%),
        var(--bg);
      color: var(--text); min-height: 100vh; line-height: 1.5;
      transition: background-color .35s ease, color .35s ease;
      -webkit-font-smoothing: antialiased;
    }
    h1,h2,h3,h4,h5 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 22px 20px 80px; }
    .muted { color: var(--muted); }
    a { color: var(--primary); }

    /* ---- top nav ---- */
    .nav { display:flex; align-items:center; justify-content:space-between; gap:16px;
           padding: 6px 2px 22px; }
    .brand { display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif;
             font-weight:600; font-size:20px; }
    .brand .dot { width:12px; height:12px; border-radius:var(--pill);
                  background:linear-gradient(135deg,var(--primary),var(--accent)); box-shadow:0 0 14px color-mix(in srgb,var(--primary) 55%, transparent); }
    .nav-actions { display:flex; align-items:center; gap:10px; }

    /* ---- buttons ---- */
    button { font-family:'Outfit',sans-serif; cursor:pointer; border:none; font-size:14px; }
    .btn-primary { background:var(--primary); color:var(--primary-contrast);
      padding:11px 22px; border-radius:var(--pill); font-weight:600;
      box-shadow:0 4px 16px color-mix(in srgb,var(--primary) 40%, transparent); transition:transform .12s ease, box-shadow .2s ease; }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 7px 22px color-mix(in srgb,var(--primary) 52%, transparent); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; transform:none; }
    .btn-outline { background:transparent; color:var(--text); border:1.5px solid var(--border);
      padding:9px 18px; border-radius:var(--pill); font-weight:500; transition:border-color .2s, background .2s; }
    .btn-outline:hover { border-color:var(--primary); background:color-mix(in srgb,var(--primary) 8%, transparent); }
    .btn-ghost { background:transparent; color:var(--muted); padding:8px 12px; border-radius:var(--r-md); font-weight:500; }
    .btn-ghost:hover { color:var(--primary); }

    /* ---- theme switcher ---- */
    .theme-sw { display:flex; align-items:center; gap:8px; background:var(--card);
      border:1px solid var(--border); border-radius:var(--pill); padding:6px 8px; box-shadow:var(--shadow); }
    .swatch { width:20px; height:20px; border-radius:var(--pill); cursor:pointer; border:2px solid transparent; padding:0; }
    .swatch.on { border-color:var(--text); }
    .mode-toggle { background:transparent; border:none; font-size:16px; padding:2px 4px; cursor:pointer; }
    .sep { width:1px; height:20px; background:var(--border); }
    .userchip { display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--text); padding:4px 4px; max-width:200px; }
    .userchip img { width:24px; height:24px; border-radius:var(--pill); object-fit:cover; }

    /* ---- cards ---- */
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--r-xl);
      padding:26px; box-shadow:var(--shadow); margin-bottom:22px; }

    /* ---- hero (landing) ---- */
    .hero { text-align:center; padding:6.5rem 1rem 4.5rem; position:relative; }
    .hero .eyebrow { text-transform:uppercase; letter-spacing:.22em; font-size:12px; font-weight:600;
      color:var(--primary); margin-bottom:18px; }
    .hero h1 { font-size:clamp(38px,7vw,68px); line-height:1.04; margin-bottom:20px; }
    .hero h1 .grad { background:linear-gradient(115deg,var(--primary),var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .hero p.lede { font-size:18px; color:var(--muted); max-width:560px; margin:0 auto 34px; }
    .uploader { display:flex; flex-direction:column; align-items:center; gap:14px; }
    .drop { border:1.5px dashed var(--border); border-radius:var(--r-xl); padding:26px 30px;
      background:var(--card); max-width:460px; width:100%; transition:border-color .2s; }
    .drop:hover { border-color:var(--primary); }
    .filename { font-size:13px; color:var(--muted); margin-top:8px; }
    input[type=file] { font-family:'Outfit',sans-serif; font-size:14px; color:var(--muted); max-width:100%; }
    input[type=file]::file-selector-button { font-family:'Outfit',sans-serif; margin-right:12px;
      background:color-mix(in srgb,var(--primary) 12%, transparent); color:var(--primary); border:none;
      padding:9px 16px; border-radius:var(--pill); font-weight:600; cursor:pointer; }

    /* ---- section headers ---- */
    .sec-title { font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-bottom:14px; font-family:'Outfit',sans-serif; font-weight:600; }
    .page-title { font-size:clamp(28px,4vw,40px); margin-bottom:6px; }

    /* ---- window tabs ---- */
    .tabs { display:inline-flex; gap:4px; background:var(--bg2); border:1px solid var(--border);
      border-radius:var(--pill); padding:4px; }
    .tabs button { background:transparent; color:var(--muted); padding:8px 18px; border-radius:var(--pill); font-weight:600; }
    .tabs button.on { background:var(--primary); color:var(--primary-contrast); box-shadow:0 3px 12px color-mix(in srgb,var(--primary) 40%, transparent); }

    /* ---- stat tiles ---- */
    /* top section: stats + profile bars on the left, personality card alongside on the right.
       Breakpoint is 1040px so the two-column split only kicks in when the left
       is still wide enough to hold all three bar charts in one row. */
    .hero-grid { display:grid; grid-template-columns:1fr; gap:22px; align-items:stretch; margin:2px 0 22px; }
    @media (min-width:1040px){ .hero-grid { grid-template-columns:minmax(0,1fr) 372px; } }
    .hero-left { display:flex; flex-direction:column; gap:18px; }
    .hero-left .bars-card { flex:1; display:flex; flex-direction:column; }
    .hero-right .card { margin-bottom:0; height:100%; display:flex; flex-direction:column; }
    .hero-right .pcard { max-width:340px; }
    /* pacing / spice / focus strip that anchors the bottom of the left column */
    .vibe { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:22px; padding-top:20px; border-top:1px solid var(--border); }
    .vibe .grp .h { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin-bottom:9px; }
    .vibe .pill2 { display:inline-flex; align-items:baseline; gap:5px; background:var(--bg2); border:1px solid var(--border);
      padding:4px 10px; border-radius:var(--pill); font-size:12.5px; margin:0 6px 6px 0; text-transform:capitalize; }
    .vibe .pill2 b { font-family:'Fraunces',serif; }
    @media (max-width:520px){ .vibe { grid-template-columns:1fr; } }
    .stat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin:0; }
    .tile { background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px; text-align:left; }
    .tile .n { font-family:'Fraunces',serif; font-size:32px; font-weight:600; line-height:1; }
    .tile .l { font-size:12.5px; color:var(--muted); margin-top:7px; text-transform:uppercase; letter-spacing:.06em; }
    .tile.click { cursor:pointer; transition:border-color .2s, transform .12s; }
    .tile.click:hover { border-color:var(--primary); transform:translateY(-2px); }
    .tile.click .n { color:var(--primary); }

    /* ---- matched list ---- */
    .matched { border:1px solid var(--border); border-radius:var(--r-lg); max-height:360px; overflow:auto; margin-bottom:8px; }
    .matched table { width:100%; border-collapse:collapse; font-size:13.5px; }
    .matched th { text-align:left; padding:10px 14px; background:var(--bg2); position:sticky; top:0;
      font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
    .matched td { padding:9px 14px; border-top:1px solid var(--border); }
    .stars { color:var(--accent); letter-spacing:1px; }

    /* ---- bar charts ---- */
    .grid3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:22px; }
    @media (max-width:640px){ .grid3 { grid-template-columns:1fr; } }
    .bar { display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:13px; }
    .bar .lab { flex:0 0 44%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:capitalize; }
    .bar .track { display:block; flex:1; background:var(--track); border-radius:var(--pill); height:9px; overflow:hidden; }
    .bar .fill { display:block; height:9px; border-radius:var(--pill); background:linear-gradient(90deg,var(--primary),var(--accent)); min-width:5px; }
    .bar .v { flex:0 0 46px; text-align:right; color:var(--muted); font-size:11.5px; }

    /* ---- selectable chips (filters) ---- */
    .chipwrap { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { border:1px solid var(--border); background:var(--card); color:var(--text);
      padding:7px 14px; border-radius:var(--pill); font-size:13px; cursor:pointer; text-transform:capitalize;
      transition:all .15s; font-family:'Outfit',sans-serif; display:inline-flex; align-items:center; gap:6px; }
    .chip:hover { border-color:var(--primary); }
    .chip.on { background:var(--primary); color:var(--primary-contrast); border-color:var(--primary); }
    .chip .k { opacity:.6; font-size:11px; }
    .chip.on .k { opacity:.85; }

    /* ---- recommendations ---- */
    .recgrid { display:grid; grid-template-columns:1fr; gap:18px; }
    @media (min-width:640px){ .recgrid { grid-template-columns:repeat(2,1fr); } }
    @media (min-width:980px){ .recgrid { grid-template-columns:repeat(3,1fr); } }
    .rec { background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg);
      padding:20px; display:flex; flex-direction:column; position:relative; overflow:hidden;
      opacity:0; transform:translateY(10px); animation:fadeUp .5s ease forwards; }
    .rec::before { content:""; position:absolute; inset:0 0 auto 0; height:4px;
      background:linear-gradient(90deg,var(--primary),var(--accent)); }
    @keyframes fadeUp { to { opacity:1; transform:none; } }
    .rec .cat { align-self:flex-start; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
      color:var(--primary); background:color-mix(in srgb,var(--primary) 12%, transparent); padding:4px 10px; border-radius:var(--pill); margin-bottom:12px; }
    .rec h4 { font-size:19px; line-height:1.2; margin-bottom:5px; }
    .rec .by { color:var(--muted); font-size:13.5px; margin-bottom:12px; }
    .rec .why { font-size:13.5px; color:var(--text); margin-bottom:12px; }
    .rec .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
    .rec .t { font-size:11.5px; color:var(--muted); background:var(--bg2); border:1px solid var(--border); padding:3px 9px; border-radius:var(--pill); text-transform:capitalize; }
    .rec .foot { margin-top:auto; display:flex; align-items:center; gap:10px; }
    .rec .score { font-size:11px; color:var(--muted); margin-right:auto; }
    .fb { border:1.5px solid var(--border); background:transparent; width:40px; height:36px; border-radius:var(--r-md); font-size:16px; transition:all .15s; }
    .fb.up:hover, .fb.up.on { background:color-mix(in srgb,var(--primary) 16%, transparent); border-color:var(--primary); }
    .fb.down:hover, .fb.down.on { background:color-mix(in srgb,var(--accent) 16%, transparent); border-color:var(--accent); }
    .fb.on { transform:scale(1.05); }

    /* ---- personality card ---- */
    /* fills its column top-to-bottom (no fixed 4:5 clip, no float, no void) */
    .pcard-outer { display:flex; flex-direction:column; align-items:center; gap:16px; flex:1; width:100%; align-self:stretch; }
    .pcard { position:relative; width:100%; max-width:340px; flex:1; min-height:430px; border-radius:var(--r-xl);
      overflow:hidden; border:1px solid var(--border); background:var(--card); box-shadow:var(--shadow); }
    .pcard .glow-a { position:absolute; width:60%; height:45%; top:-10%; right:-12%; border-radius:50%;
      background:radial-gradient(circle, color-mix(in srgb,var(--primary) 85%, transparent), transparent 70%); }
    .pcard .glow-b { position:absolute; width:62%; height:48%; bottom:-12%; left:-14%; border-radius:50%;
      background:radial-gradient(circle, color-mix(in srgb,var(--accent) 82%, transparent), transparent 70%); }
    .pcard .wash { position:absolute; inset:0; background:linear-gradient(150deg, color-mix(in srgb,var(--primary) 14%, transparent), transparent 45%, color-mix(in srgb,var(--accent) 16%, transparent)); }
    .pcard .inner { position:relative; z-index:2; height:100%; padding:30px 28px; display:flex; flex-direction:column; }
    .pcard .kicker { font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); font-weight:600; }
    .pcard .emoji { font-size:52px; margin:6px 0 8px; }
    .pcard .arche { font-family:'Fraunces',serif; font-size:34px; font-weight:700; line-height:1.05;
      background:linear-gradient(120deg,var(--primary),var(--accent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .pcard .tag { font-size:14px; color:var(--text); margin-top:10px; }
    .pcard .pstats { margin-top:auto; display:grid; grid-template-columns:1fr 1fr; gap:12px 10px; }
    .pcard .ps .pn { font-family:'Fraunces',serif; font-size:22px; font-weight:600; }
    .pcard .ps .pl { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
    .pcard .sig { margin-top:16px; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .pcard .sig .lumina { font-family:'Fraunces',serif; font-weight:600; color:var(--text); }

    details > summary { cursor:pointer; font-weight:600; list-style:none; }
    details > summary::-webkit-details-marker { display:none; }
    .banner { padding:12px 16px; border-radius:var(--r-md); margin-bottom:16px; font-size:14px; }
    .banner.ok { background:color-mix(in srgb, #22c55e 16%, transparent); color:var(--text); }
    .banner.err { background:color-mix(in srgb, #ef4444 18%, transparent); color:var(--text); }
    .pending li { padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px; list-style:none; }
    .seen { color:var(--muted); font-size:12px; float:right; }
    .center { text-align:center; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const WINDOWS = [
      { key:'all', label:'All time' },
      { key:'1y',  label:'Last 12 months' },
      { key:'6m',  label:'Last 6 months' },
    ];
    const THEMES = [
      { key:'sunset', light:'#3B82F6', accent:'#F43F5E', name:'Sunset' },
      { key:'luxe',   light:'#0F766E', accent:'#F59E0B', name:'Luxe' },
      { key:'cyber',  light:'#0891B2', accent:'#FF477E', name:'Cyber' },
    ];
    const pretty = s => (s||'').replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    // A session can expire while the app is open. Any protected endpoint then
    // returns 401; route every such response through a single handler so the UI
    // drops back to the login screen instead of silently breaking.
    class AuthError extends Error { constructor(){ super('session expired'); this.name='AuthError'; } }
    let _onUnauth = null;                       // registered by the App on mount
    const check401 = (r) => {
      if (r.status === 401) { if (_onUnauth) _onUnauth(); throw new AuthError(); }
      return r;
    };
    const api = (u) => fetch(u).then(check401).then(r => r.json());

    /* ---------- reader archetype (derived only from the user's own data) ---------- */
    function deriveArchetype(p) {
      const g = (p.top_genres||[]).map(x => (x.slug||x.name||'').toLowerCase());
      const tr = (p.top_tropes||[]).map(x => (x.slug||'').toLowerCase());
      const tg = (p.top_tags||[]).map(x => (x.slug||'').toLowerCase());
      const all = [...tr, ...tg];
      const has = (arr, ...k) => k.some(w => (arr||[]).some(x => (x||'').includes(w)));
      const spicy = Object.entries(p.spice||{}).some(([k,v]) => /explicit|medium/i.test(k) && v>0);
      const gTop = g[0] || '';

      const A = (emoji,name,tag) => ({emoji,name,tag});
      // genre-led archetypes with modifiers
      if (has(g,'sci-fi','science fiction')) {
        if (has(all,'human','ai','consciousness','transhuman')) return A('🪐','The Cosmic Philosopher','You chase the big questions across the stars.');
        return A('🚀','The Starfarer','No frontier is too far, no galaxy too strange.');
      }
      if (has(g,'fantasy','romantasy')) {
        if (spicy || has(all,'fated','mate','court')) return A('🐉','The Realm Enchanted','Magic, longing, and a court intrigue or two.');
        if (has(all,'found-family','quest','chosen')) return A('⚔️','The Questbound','You ride with the ragtag band to the last page.');
        return A('🔮','The Realm Wanderer','You live where maps end and magic begins.');
      }
      if (has(g,'romance')) {
        if (spicy) return A('🔥','The Ardent Heart','You like the tension turned all the way up.');
        return A('💌','The Hopeless Romantic','You believe every slow burn is worth the wait.');
      }
      if (has(g,'mystery','thriller','crime')) return A('🕵️','The Midnight Sleuth','You never trust the quiet one on page ten.');
      if (has(g,'horror')) return A('🌑','The Shadow Dweller','You read the creak on the stairs on purpose.');
      if (has(g,'young adult')) return A('🌱','The Coming-of-Ager','You root for the messy, hopeful first chapters.');
      // tone-led fallbacks
      if (has(tg,'dark','tense')) return A('🖤','The Twilight Reader','Drawn to the shadowed, the tense, the unresolved.');
      if (has(tg,'reflective','emotional','hopeful')) return A('🕯️','The Quiet Contemplative','You read for the feeling that lingers after.');
      if (has(g,'biography','memoir','history')) return A('📜','The Chronicle Keeper','Real lives and true stories are your escape.');
      return A('📚','The Eclectic Reader','Your shelf refuses to be put in one box.');
    }

    function ThemeSwitcher({ theme, mode, setTheme, setMode }) {
      return (
        <div className="theme-sw" title="Theme">
          {THEMES.map(t => (
            <button key={t.key} className={'swatch'+(theme===t.key?' on':'')} onClick={()=>setTheme(t.key)}
              title={t.name} style={{background:`linear-gradient(135deg, ${t.light}, ${t.accent})`}} aria-label={t.name}></button>
          ))}
          <span className="sep"></span>
          <button className="mode-toggle" onClick={()=>setMode(mode==='light'?'dark':'light')} title="Light / dark">
            {mode==='light' ? '🌙' : '☀️'}
          </button>
        </div>
      );
    }

    function BarList({ items }) {
      if (!items || !items.length) return <div className="muted" style={{fontSize:14}}>No data in this window.</div>;
      const max = Math.max(...items.map(i => i.weight));
      return items.map(it => (
        <div key={it.slug||it.name} className="bar">
          <span className="lab" title={pretty(it.slug||it.name)}>{pretty(it.slug||it.name)}</span>
          <span className="track"><span className="fill" style={{width:`${Math.max(5,(it.weight/max)*100)}%`}}></span></span>
          <span className="v">{it.count}×</span>
        </div>
      ));
    }

    function VibeStrip({ profile }) {
      const groups = [
        { h:'Pacing', data:profile.pacing },
        { h:'Spice', data:profile.spice },
        { h:'Focus', data:profile.focus },
      ].filter(g => g.data && Object.keys(g.data).length);
      if (!groups.length) return null;
      return (
        <div className="vibe">
          {groups.map(g => (
            <div className="grp" key={g.h}>
              <div className="h">{g.h}</div>
              {Object.entries(g.data).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v]) =>
                <span className="pill2" key={k}>{pretty(k)} <b>{v}</b></span>)}
            </div>
          ))}
        </div>
      );
    }

    function PersonalityCard({ profile }) {
      const ref = useRef(null);
      const a = deriveArchetype(profile);
      const topG = (profile.top_genres||[])[0];
      const topT = (profile.top_tropes||[])[0];
      const exporting = useRef(false);

      const render = async () => {
        const node = ref.current;
        const canvas = await html2canvas(node, { scale: 2, backgroundColor: null, useCORS: true, logging:false });
        return new Promise(res => canvas.toBlob(res, 'image/png'));
      };
      const download = async () => {
        if (exporting.current) return; exporting.current = true;
        try {
          const blob = await render();
          const url = URL.createObjectURL(blob);
          const a2 = document.createElement('a'); a2.href = url; a2.download = 'my-reading-personality.png';
          document.body.appendChild(a2); a2.click(); a2.remove(); URL.revokeObjectURL(url);
        } finally { exporting.current = false; }
      };
      const share = async () => {
        try {
          const blob = await render();
          const file = new File([blob], 'reading-personality.png', { type:'image/png' });
          if (navigator.canShare && navigator.canShare({ files:[file] })) {
            await navigator.share({ files:[file], title:'My Reading Personality',
              text:`I'm ${a.name} — ${a.tag}` });
          } else { download(); }
        } catch(e) { /* user cancelled */ }
      };

      return (
        <div className="pcard-outer">
          <div className="pcard" ref={ref}>
            <div className="glow-a"></div><div className="glow-b"></div><div className="wash"></div>
            <div className="inner">
              <div className="kicker">My Reading Personality</div>
              <div className="emoji">{a.emoji}</div>
              <div className="arche">{a.name}</div>
              <div className="tag">{a.tag}</div>
              <div className="pstats">
                <div className="ps"><div className="pn">{profile.total_books}</div><div className="pl">Books read</div></div>
                <div className="ps"><div className="pn">{profile.avg_rating ?? '—'}★</div><div className="pl">Avg rating</div></div>
                <div className="ps"><div className="pn" style={{textTransform:'capitalize'}}>{topG ? pretty(topG.slug||topG.name) : '—'}</div><div className="pl">Top genre</div></div>
                <div className="ps"><div className="pn" style={{fontSize:16,textTransform:'capitalize'}}>{topT ? pretty(topT.slug) : '—'}</div><div className="pl">Signature trope</div></div>
              </div>
              <div className="sig">✦ <span className="lumina">Lumina</span> · reading universe</div>
            </div>
          </div>
          <div style={{display:'flex',gap:10}}>
            <button className="btn-primary" onClick={share}>Share</button>
            <button className="btn-outline" onClick={download}>Download PNG</button>
          </div>
        </div>
      );
    }

    function App() {
      const [theme, setThemeS] = useState(localStorage.getItem('lumina-theme') || 'sunset');
      const [mode, setModeS] = useState(localStorage.getItem('lumina-mode') ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      const setTheme = t => { setThemeS(t); localStorage.setItem('lumina-theme', t); };
      const setMode = m => { setModeS(m); localStorage.setItem('lumina-mode', m); };
      useEffect(() => { document.documentElement.dataset.theme = theme; document.documentElement.dataset.mode = mode; }, [theme, mode]);

      const [view, setView] = useState('loading');       // loading | login | landing | profile
      const [me, setMe] = useState(null);
      const [sessionExpired, setSessionExpired] = useState(false);
      const [win, setWin] = useState('all');
      const [profile, setProfile] = useState(null);
      const [recs, setRecs] = useState([]);
      const [recsNote, setRecsNote] = useState(null);
      const [pending, setPending] = useState([]);
      const [file, setFile] = useState(null);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      const [matchedOpen, setMatchedOpen] = useState(false);
      const [matched, setMatched] = useState([]);
      const [selTropes, setSelTropes] = useState(new Set());
      const [selTags, setSelTags] = useState(new Set());
      const [fb, setFb] = useState({});

      const [recsLoading, setRecsLoading] = useState(false);
      const loadRecs = async (w, tr=selTropes, tg=selTags) => {
        const q = new URLSearchParams({ window:w });
        if (tr.size) q.set('tropes', [...tr].join(','));
        if (tg.size) q.set('tags', [...tg].join(','));
        setRecsLoading(true);
        try {
          const d = await api('/api/recommendations?'+q.toString());
          setRecs(d.recommendations||[]); setRecsNote(d.note);
        } catch(e) { setRecsNote('Recommendations are momentarily unavailable — try again in a moment.'); }
        setFb({}); setRecsLoading(false);
      };
      // Render the view as soon as the (fast) profile loads; recs + pending fill
      // in asynchronously so a slow/among-writes recommendations scan never blocks
      // the whole page.
      const loadAll = async (w) => {
        let p;
        try { p = await api('/api/profile?window='+w); }
        catch(e) { return; }   // AuthError already redirected to login
        setProfile(p.total_books>0 ? p : null);
        setView(p.total_books>0 ? 'profile' : 'landing');
        api('/api/pending-books').then(setPending).catch(()=>{});
        loadRecs(w);
      };
      const logout = async () => { await fetch('/auth/logout', {method:'POST'}); location.href='/'; };
      useEffect(() => {
        // Any 401 from a background request (expired session) lands here: mark the
        // session expired and return to login, without wiping the chosen theme.
        _onUnauth = () => {
          setMe(m => (m ? {...m, authenticated:false} : m));
          setSessionExpired(true);
          setView('login');
        };
        (async () => {
          let m; try { m = await api('/api/me'); } catch(e) { m = {authenticated:false, oauth_enabled:true}; }
          setMe(m);
          if (m.authenticated) loadAll(win);
          else setView('login');
        })();
        return () => { _onUnauth = null; };
      }, []);

      const changeWin = async (w) => {
        setWin(w); setMatchedOpen(false); setSelTropes(new Set()); setSelTags(new Set());
        try { await Promise.all([ api('/api/profile?window='+w).then(d=>setProfile(d.total_books>0?d:null)), loadRecs(w, new Set(), new Set()) ]); }
        catch(e) { if (e.name!=='AuthError') throw e; }
      };
      const toggleMatched = async () => {
        if (matchedOpen) { setMatchedOpen(false); return; }
        try { const d = await api('/api/matched-books?window='+win); setMatched(d.books||[]); setMatchedOpen(true); }
        catch(e) { if (e.name!=='AuthError') throw e; }
      };
      const toggleFilter = (slug, kind) => {
        const S = kind==='trope' ? new Set(selTropes) : new Set(selTags);
        S.has(slug) ? S.delete(slug) : S.add(slug);
        kind==='trope' ? setSelTropes(S) : setSelTags(S);
      };
      const applyFilters = () => loadRecs(win, selTropes, selTags);
      const clearFilters = () => { const a=new Set(),b=new Set(); setSelTropes(a); setSelTags(b); loadRecs(win, a, b); };

      const upload = async () => {
        if (!file) return; setBusy(true); setMsg(null);
        const fd = new FormData(); fd.append('file', file);
        try {
          const res = check401(await fetch('/api/upload-csv', { method:'POST', body:fd }));
          if (!res.ok) throw new Error('Server error '+res.status);
          const d = await res.json();
          setMsg({ ok:true, text:`Imported ${d.total_read} read books — ${d.matched} matched, ${d.ambiguous} probable, ${d.unmatched} not in catalog yet.` });
          setFile(null); await loadAll(win);
        } catch(e) { if (e.name!=='AuthError') setMsg({ ok:false, text:'Upload failed: '+e.message }); }
        setBusy(false);
      };
      const feedback = async (id, rating) => {
        if (id==null) { setFb(p=>({...p,[id]:rating})); return; }
        try { check401(await fetch('/api/feedback',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({recommendation_id:id, rating}) })); }
        catch(e) { if (e.name==='AuthError') return; }
        setFb(p => ({...p, [id]:rating}));
      };

      const Nav = () => (
        <div className="nav">
          <div className="brand"><span className="dot"></span> Lumina</div>
          <div className="nav-actions">
            {view==='profile' && <button className="btn-ghost" onClick={()=>setView('landing')}>↑ Import new data</button>}
            {me && me.authenticated && me.user && !me.demo &&
              <span className="userchip">{me.user.avatar_url && <img src={me.user.avatar_url} alt="" />}{me.user.display_name || me.user.email}</span>}
            {me && me.demo && <span className="chip">Demo mode</span>}
            {me && me.authenticated && me.oauth_enabled &&
              <button className="btn-ghost" onClick={logout}>Log out</button>}
            <ThemeSwitcher theme={theme} mode={mode} setTheme={setTheme} setMode={setMode} />
          </div>
        </div>
      );

      if (view==='loading') return <div className="wrap"><Nav/><div className="muted center" style={{padding:60}}>Loading your reading universe…</div></div>;

      if (view==='login') return (
        <div className="wrap">
          <Nav/>
          <div className="hero">
            <div className="eyebrow">Welcome to Lumina</div>
            <h1>Your reading universe,<br/><span className="grad">illuminated.</span></h1>
            {sessionExpired && <div className="banner err">Your session expired — please sign in again.</div>}
            <p className="lede">Sign in to import your Goodreads history and discover books tuned to your taste — the genres, tropes, and moods you love.</p>
            <a className="btn-primary" href="/auth/login" style={{textDecoration:'none', display:'inline-flex', alignItems:'center', gap:10}}>
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1H12v3.83h5.35c-.23 1.5-1.72 4.4-5.35 4.4-3.22 0-5.85-2.66-5.85-5.94s2.63-5.94 5.85-5.94c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.9 3.2 14.7 2.2 12 2.2 6.9 2.2 2.75 6.35 2.75 11.4S6.9 20.6 12 20.6c5.28 0 8.78-3.71 8.78-8.94 0-.6-.07-1.06-.15-1.56z"/></svg>
              Sign in with Google
            </a>
          </div>
        </div>
      );

      if (view==='landing') return (
        <div className="wrap">
          <Nav/>
          <div className="hero">
            <div className="eyebrow">Your reading universe, illuminated</div>
            <h1>Discover your next<br/><span className="grad">favourite story.</span></h1>
            <p className="lede">Import your Goodreads history and Lumina reads your taste — genres, tropes, and the moods you love — to recommend books that actually fit you.</p>
            {msg && <div className={'banner '+(msg.ok?'ok':'err')}>{msg.text}</div>}
            <div className="uploader">
              <div className="drop">
                <input type="file" accept=".csv" onChange={e=>setFile(e.target.files[0])} disabled={busy}/>
                {file && <div className="filename">{file.name}</div>}
              </div>
              <button className="btn-primary" onClick={upload} disabled={!file||busy}>{busy?'Importing…':'Import Goodreads CSV'}</button>
              {profile && <button className="btn-outline" onClick={()=>setView('profile')}>View my profile →</button>}
            </div>
          </div>
        </div>
      );

      // ---- profile view ----
      const filterPool = [
        ...(profile?.top_tropes||[]).map(x => ({...x, kind:'trope'})),
        ...(profile?.top_tags||[]).filter(x => !['reflective','emotional','challenging','tense','dark','hopeful','sad','adventurous','inspiring','mysterious','funny','lighthearted'].includes(x.slug)).map(x => ({...x, kind:'tag'})),
      ];
      const activeCount = selTropes.size + selTags.size;

      return (
        <div className="wrap">
          <Nav/>
          {msg && <div className={'banner '+(msg.ok?'ok':'err')}>{msg.text}</div>}
          <div style={{display:'flex',flexWrap:'wrap',gap:16,alignItems:'flex-end',justifyContent:'space-between',marginBottom:20}}>
            <div>
              <div className="sec-title" style={{marginBottom:4}}>Your reading profile</div>
              <h1 className="page-title">A universe of {profile?.total_books ?? 0} books</h1>
            </div>
            <div className="tabs">
              {WINDOWS.map(w => <button key={w.key} className={win===w.key?'on':''} onClick={()=>changeWin(w.key)}>{w.label}</button>)}
            </div>
          </div>

          <div className="hero-grid">
            <div className="hero-left">
              <div className="stat-row">
                <div className="tile"><div className="n">{profile?.total_books ?? 0}</div><div className="l">Books read</div></div>
                <div className="tile click" onClick={toggleMatched} title="See your matched books"><div className="n">{profile?.matched_books ?? 0}</div><div className="l">In catalog · {matchedOpen?'hide':'view'}</div></div>
                <div className="tile"><div className="n">{profile?.avg_rating ?? '—'}</div><div className="l">Avg rating</div></div>
                <div className="tile"><div className="n">{(profile?.catalog_total||0).toLocaleString()}</div><div className="l">Books in database</div></div>
              </div>

              {matchedOpen && (
                <div className="card" style={{padding:0, marginBottom:0}}>
                  <div className="matched">
                    <table>
                      <thead><tr><th>Title</th><th>Author</th><th>Genre</th><th>Rating</th><th>Read</th></tr></thead>
                      <tbody>
                        {matched.map((b,i)=>(
                          <tr key={i}><td>{b.title}</td><td>{b.author}</td>
                            <td className="muted">{(b.genres||[]).slice(0,2).join(' · ')}</td>
                            <td className="stars">{b.rating?'★'.repeat(b.rating):'—'}</td>
                            <td className="muted">{b.date_read||'—'}</td></tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              <div className="card bars-card" style={{marginBottom:0}}>
                <div className="grid3">
                  <div><div className="sec-title">Top Genres</div><BarList items={profile?.top_genres}/></div>
                  <div><div className="sec-title">Top Tropes</div><BarList items={profile?.top_tropes}/></div>
                  <div><div className="sec-title">Top Tags</div><BarList items={(profile?.top_tags||[]).slice(0,10)}/></div>
                </div>
                {profile && <VibeStrip profile={profile}/>}
              </div>
            </div>

            <div className="hero-right">
              <div className="card">
                <div className="center" style={{marginBottom:16}}><div className="sec-title">Your reader personality</div></div>
                {profile && <PersonalityCard profile={profile}/>}
              </div>
            </div>
          </div>

          <div className="card">
            <div className="sec-title">Steer your recommendations</div>
            <p className="muted" style={{fontSize:14,marginBottom:14,marginTop:-4}}>Select tropes or tags to show only books that feature them. {activeCount>0 && <b>{activeCount} selected.</b>}</p>
            <div className="chipwrap">
              {filterPool.map(it => {
                const on = it.kind==='trope' ? selTropes.has(it.slug) : selTags.has(it.slug);
                return <button key={it.kind+it.slug} className={'chip'+(on?' on':'')} onClick={()=>toggleFilter(it.slug, it.kind)}>
                  {pretty(it.slug)} <span className="k">{it.kind}</span></button>;
              })}
            </div>
            <div style={{display:'flex',gap:10,marginTop:16}}>
              <button className="btn-primary" onClick={applyFilters} disabled={activeCount===0}>Update recommendations</button>
              {activeCount>0 && <button className="btn-outline" onClick={clearFilters}>Clear</button>}
            </div>
          </div>

          <div style={{marginTop:8,marginBottom:14,display:'flex',alignItems:'baseline',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
            <h2 style={{fontSize:26}}>Recommended for you</h2>
            {activeCount>0 && <span className="muted" style={{fontSize:13}}>filtered by {activeCount} selection{activeCount>1?'s':''}</span>}
          </div>
          {recsNote && <div className="muted" style={{marginBottom:14}}>{recsNote}</div>}
          {recsLoading && recs.length===0 && <div className="muted" style={{padding:'8px 0 18px'}}>Curating your recommendations…</div>}
          <div className="recgrid">
            {recs.map((r,i) => (
              <div key={r.id ?? r.book_id ?? i} className="rec" style={{animationDelay:`${i*70}ms`}}>
                <span className="cat">{r.category}</span>
                <h4>{r.title}</h4>
                <div className="by">{r.author}</div>
                <div className="why">{r.reason}</div>
                {r.chips && r.chips.length>0 &&
                  <div className="tags">{r.chips.slice(0,4).map((c,j)=><span key={j} className="t">{pretty(c)}</span>)}</div>}
                <div className="foot">
                  <span className="score">match {r.score}</span>
                  <button className={'fb up'+(fb[r.id]==='up'?' on':'')} disabled={!!fb[r.id]} onClick={()=>feedback(r.id,'up')}>👍</button>
                  <button className={'fb down'+(fb[r.id]==='down'?' on':'')} disabled={!!fb[r.id]} onClick={()=>feedback(r.id,'down')}>👎</button>
                </div>
              </div>
            ))}
          </div>

          {pending.length>0 &&
            <div className="card" style={{marginTop:22}}>
              <details>
                <summary>Books not in the catalog yet ({pending.length})</summary>
                <ul className="pending" style={{marginTop:10}}>
                  {pending.map(b => <li key={b.id}><b>{b.raw_title}</b> <span className="muted">by {b.raw_author}</span><span className="seen">seen {b.seen_count}×</span></li>)}
                </ul>
              </details>
            </div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
